<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Ionicons -->
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

    <title>KapeBara Pandapay Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="p-3">

<div class="container-xl">
    <div class="row g-4">

        <!-- LEFT COLUMN -->
        <div class="col-12 col-lg-4">
            
            <!-- Balance Card -->
            <div class="balance-card shadow-sm">
                <div class="balance-header">
                    <div class="logo d-flex align-items-center">
                        <span class="logo-text">KapeBara Wallet.</span>
                    </div>
                    <div class="settings-icon">
                        <a href="#"><ion-icon name="settings-outline"></ion-icon></a>
                    </div>
                </div>
                <div class="balance-label">Available balance</div>
                <div class="balance-amount" id="walletBalance">₱ 0.00</div>
            </div>

            <!-- Top Up Button -->
            <a href="/topup" class="top-up-btn d-flex align-items-center">
                <span class="icon"><ion-icon name="reload-outline"></ion-icon></span>
                <span class="top-up-text">Top up</span>
            </a>

        </div>

        <!-- RIGHT COLUMN -->
        <div class="col-12 col-lg-8">

            <!-- Recent Activities -->
            <div class="activities-section shadow-sm mt-3">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="section-title d-flex gap-2 align-items-center">
                        <span class="icon"><ion-icon name="reload-circle-outline"></ion-icon></span>
                        <span>Recent activities</span>
                    </div>
                    <a href="#" class="view-all-link">View all</a>
                </div>

                <!-- Activity 1 -->
                <div class="activity-item d-flex">
                    <div class="activity-icon"><ion-icon name="document-text-outline"></ion-icon></div>
                    <div class="activity-info flex-grow-1">
                        <div class="activity-header d-flex justify-content-between">
                            <span class="activity-type">Order</span>
                            <span class="activity-date">MM/DD/YYYY</span>
                        </div>
                        <div class="activity-details">KapeBara – XBranchX</div>
                    </div>
                    <div class="activity-right text-end">
                        <span class="activity-amount">- ₱ 000.00</span>
                        <span class="arrow"><ion-icon name="chevron-forward-outline"></ion-icon></span>
                    </div>
                </div>

                <!-- Activity 2 -->
                <div class="activity-item d-flex">
                    <div class="activity-icon"><ion-icon name="document-text-outline"></ion-icon></div>
                    <div class="activity-info flex-grow-1">
                        <div class="activity-header d-flex justify-content-between">
                            <span class="activity-type">Order</span>
                            <span class="activity-date">MM/DD/YYYY</span>
                        </div>
                        <div class="activity-details">KapeBara – XBranchX</div>
                    </div>
                    <div class="activity-right text-end">
                        <span class="activity-amount">- ₱ 000.00</span>
                        <span class="arrow"><ion-icon name="chevron-forward-outline"></ion-icon></span>
                    </div>
                </div>

            </div>

        </div>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    
    function updateBalance() {
        const balance = parseFloat(localStorage.getItem('walletBalance') || '0');
        const balanceEl = document.getElementById('walletBalance');
        if (balanceEl) {
            balanceEl.textContent = '₱ ' + balance.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
        }
        console.log('[Static HTML] Balance updated:', balance);
    }
    
    
    updateBalance();
    
    
    setInterval(updateBalance, 1000);
    
    
    window.addEventListener('storage', updateBalance);
    
    
    window.addEventListener('walletBalanceUpdated', updateBalance);

    
    (function () {
        function closeModal(overlay) {
            if (overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay);
        }

        function buildModalContent(type, date, details, amount) {
            var html = '';
            html += '<div class="activity-modal" role="dialog" aria-modal="true">';
            html += '  <div class="modal-header d-flex justify-content-between align-items-center">';
            html += '    <h5 class="mb-0">' + (type === 'Top-up' ? 'Top-up Details' : 'Order Details') + '</h5>';
            html += '    <button class="btn-close" data-close aria-label="Close"></button>';
            html += '  </div>';
            html += '  <div class="modal-body mt-3">';
            if (type === 'Top-up') {
                html += '    <div><strong>Top-up date:</strong> ' + date + '</div>';
                html += '    <div><strong>MOP / Source:</strong> ' + details + '</div>';
                html += '    <div><strong>Amount:</strong> ' + amount + '</div>';
            } else {
                html += '    <div><strong>Order date:</strong> ' + date + '</div>';
                html += '    <div><strong>Order location:</strong> ' + details + '</div>';
                html += '    <div><strong>Amount:</strong> ' + amount + '</div>';
            }
            html += '    <div class="mt-3 text-danger"><strong>Error:</strong> Details page not available yet.</div>';
            html += '  </div>';
            html += '  <div class="modal-footer mt-3 text-end">';
            html += '    <button class="btn btn-secondary" data-close>Close</button>';
            html += '  </div>';
            html += '</div>';
            return html;
        }

        document.querySelectorAll('.activity-item').forEach(function (item) {
            item.style.cursor = 'pointer';
            item.addEventListener('click', function () {
                var typeEl = item.querySelector('.activity-type');
                var dateEl = item.querySelector('.activity-date');
                var detailsEl = item.querySelector('.activity-details');
                var amountEl = item.querySelector('.activity-amount');

                var type = typeEl ? typeEl.textContent.trim() : 'Order';
                var date = dateEl ? dateEl.textContent.trim() : '';
                var details = detailsEl ? detailsEl.textContent.trim() : '';
                var amount = amountEl ? amountEl.textContent.trim() : '';

                var overlay = document.createElement('div');
                overlay.className = 'activity-modal-overlay';
                overlay.innerHTML = buildModalContent(type, date, details, amount);

                
                overlay.addEventListener('click', function () { closeModal(overlay); });

                
                var modal = overlay.querySelector('.activity-modal');
                if (modal) {
                    modal.addEventListener('click', function (e) { e.stopPropagation(); });

                    
                    var closes = modal.querySelectorAll('[data-close]');
                    closes.forEach(function (btn) {
                        btn.addEventListener('click', function (ev) {
                            ev.preventDefault();
                            closeModal(overlay);
                        });
                    });
                }

                document.body.appendChild(overlay);
            });
        });
    })();
</script>

</body>
</html>
