<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Top-up</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Ionicons -->
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="topUp.css">
</head>
<body class="bg-light">

<div class="box">

  <!-- Back Button -->
  <a href="index.html" class="btn btn-outline-secondary mb-3">
    <ion-icon name="arrow-back-outline" class="me-1"></ion-icon> Back
  </a>

  <!-- Section 1: Amount -->
  <div class="card mb-3 p-3 section">
    <h5>Step 1. Top up amount</h5>
    <div class="brand mb-2">
      <span class="brand-text">Foodpanda Pay</span>
    </div>
    <p class="balance text-muted mb-2" id="walletBalance">Balance: ₱ 0.00</p>

    <div class="d-flex gap-2 mb-2">
      <button class="btn btn-outline-secondary flex-fill suggest-btn" type="button" data-amount="200">₱ 200</button>
      <button class="btn btn-outline-secondary flex-fill suggest-btn" type="button" data-amount="500">₱ 500</button>
      <button class="btn btn-outline-secondary flex-fill suggest-btn" type="button" data-amount="1000">₱ 1,000</button>
    </div>

    <input type="number" class="form-control mb-1" placeholder="₱ Enter amount">
    <small class="text-muted">Enter an amount from ₱ 50.00</small>
  </div>

  <!-- Section 2: Payment Method -->
  <div class="card mb-3 p-3 section">
    <h5>Step 2. Payment method</h5>

    <!-- GCash Option -->
    <div class="form-check mb-2">
      <input class="form-check-input" type="radio" name="paymethod" id="gcash">
      <label class="form-check-label d-flex align-items-center p-2 border rounded" for="gcash">
        <ion-icon name="wallet-outline" class="me-2 fs-3"></ion-icon>
        GCash (Alipay+ Partner)
      </label>
    </div>

    <!-- Credit Card Option -->
    <div class="form-check mb-2">
      <input class="form-check-input" type="radio" name="paymethod" id="card" checked>
      <label class="form-check-label p-2 border rounded w-100" for="card">
        <div class="d-flex align-items-center gap-2 mb-2">
          <ion-icon name="card-outline" class="fs-3"></ion-icon>
          <span class="fw-bold">Credit Card</span>
          <ion-icon name="logo-visa" class="fs-3 ms-3"></ion-icon>
          <ion-icon name="logo-mastercard" class="fs-3"></ion-icon>
        </div>

        <input class="form-control mb-2" placeholder="Card number" id="cardNumber" maxlength="19">
        <div class="d-flex gap-2 mb-2">
          <input class="form-control" placeholder="MM/YY" id="expiryDate" maxlength="5">
          <input class="form-control" placeholder="CVC" id="cvcInput" maxlength="4">
        </div>
        <input class="form-control mb-2" placeholder="Name of the card holder" id="cardholderName">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="saveCard" checked>
          <label class="form-check-label" for="saveCard">
            Save this card for a faster checkout next time
          </label>
        </div>
      </label>
    </div>

  </div>

  <!-- Confirm Button -->
  <button class="btn btn-primary w-100" type="button" id="confirmBtn">Confirm Top-up</button>
  <div id="errorMsg" style="color:#dc3545;font-size:14px;margin-top:8px;text-align:center;display:none"></div>
</div>

<script>
  (function(){
    var suggestBtns = document.querySelectorAll('.suggest-btn');
    var amountInput = document.querySelector('input[placeholder*="Enter amount"]');
    var confirmBtn = document.getElementById('confirmBtn');
    var gcashRadio = document.getElementById('gcash');
    var cardRadio = document.getElementById('card');
    // Load wallet balance from localStorage
    var walletBalance = parseFloat(localStorage.getItem('walletBalance') || '0');
    var balanceElem = document.getElementById('walletBalance');
    function updateBalanceDisplay() {
      walletBalance = parseFloat(localStorage.getItem('walletBalance') || '0');
      if (balanceElem) {
        balanceElem.textContent = 'Balance: ₱ ' + walletBalance.toLocaleString(undefined, {minimumFractionDigits: 2});
      }
    }
    updateBalanceDisplay();
    // No debug UI: balance reads are internal

    // Wire suggestion buttons
    if(amountInput) {
      suggestBtns.forEach(function(btn){
        btn.addEventListener('click', function(){
          var v = btn.getAttribute('data-amount');
          amountInput.value = v;
          var ev = new Event('input', { bubbles: true });
          amountInput.dispatchEvent(ev);
        });
      });
    }

    // Confirm button handler
    if(confirmBtn) {
      confirmBtn.addEventListener('click', function(e){
        e.preventDefault();
        var amount = parseFloat(amountInput.value) || 0;
        
        // Validation: amount must be > 0
        if(amount <= 0) {
          errorMsg.textContent = 'Invalid amount. Please enter an amount greater than ₱0';
          errorMsg.style.display = 'block';
          return;
        }
        
        // Hide error message if validation passes
        errorMsg.style.display = 'none';
        
        // Card validation if Credit Card is selected
        if(cardRadio.checked) {
          var cardNumberInput = document.getElementById('cardNumber');
          var expiryInput = document.getElementById('expiryDate');
          var cvcInput = document.getElementById('cvcInput');
          var cardholderInput = document.getElementById('cardholderName');
          
          var cardNumber = (cardNumberInput.value || '').replace(/\s/g, '');
          var expiry = expiryInput.value || '';
          var cvc = cvcInput.value || '';
          var cardholder = (cardholderInput.value || '').trim();
          
          // Card number validation (12-19 digits)
          if(!cardNumber || cardNumber.length < 12 || cardNumber.length > 19 || !/^\d+$/.test(cardNumber)) {
            errorMsg.textContent = 'Invalid card number. Please enter 12-19 digits.';
            errorMsg.style.display = 'block';
            return;
          }
          
          // Expiration date validation (MM/YY format)
          var expiryRegex = /^(0[1-9]|1[0-2])\/\d{2}$/;
          if(!expiry || !expiryRegex.test(expiry)) {
            errorMsg.textContent = 'Invalid expiration date. Use MM/YY format (e.g., 08/26).';
            errorMsg.style.display = 'block';
            return;
          }
          
          // CVC validation (3-4 digits)
          if(!cvc || cvc.length < 3 || cvc.length > 4 || !/^\d+$/.test(cvc)) {
            errorMsg.textContent = 'Invalid CVC. Please enter 3-4 digits.';
            errorMsg.style.display = 'block';
            return;
          }
          
          // Cardholder name validation
          if(!cardholder || cardholder.length < 2) {
            errorMsg.textContent = 'Please enter the cardholder name.';
            errorMsg.style.display = 'block';
            return;
          }
        }
        
        var selectedMethod = gcashRadio.checked ? 'GCash' : 'Debit / Credit';
        
        // Create review modal
        var overlay = document.createElement('div');
        overlay.className = 'activity-modal-overlay';
        overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:9999';
        
        var modal = document.createElement('div');
        modal.className = 'activity-modal';
        modal.style.cssText = 'background:#fff;border-radius:8px;width:340px;padding:24px;box-shadow:0 8px 30px rgba(0,0,0,0.25);text-align:center';
        
        var payWithText = gcashRadio.checked ? 'PAY WITH GCASH' : 'PAY WITH DEBIT / CREDIT';
        
        modal.innerHTML = '<div style="font-size:13px;color:#999;margin-bottom:8px">TOP-UP AMOUNT</div>' +
                          '<div style="font-size:32px;font-weight:700;margin:8px 0">₱' + amount.toLocaleString(undefined, {minimumFractionDigits: 2}) + '</div>' +
                          '<div style="font-size:13px;color:#999;margin-bottom:16px">' + payWithText + '</div>' +
                          '<button class="btn btn-primary w-100" id="confirmReviewBtn" style="width:100%">CONFIRM TOP-UP</button>';
        
        overlay.appendChild(modal);
        modal.addEventListener('click', function(e){ e.stopPropagation(); });
        
        function closeReview(){
          if(overlay.parentNode) overlay.parentNode.removeChild(overlay);
        }
        
        overlay.addEventListener('click', closeReview);
        document.body.appendChild(overlay);
        
        // Confirm in review
        document.getElementById('confirmReviewBtn').addEventListener('click', function(){
          closeReview();
          walletBalance += amount;
          localStorage.setItem('walletBalance', walletBalance);
          // Dispatch in-tab event so React wallet updates immediately
          try {
            window.dispatchEvent(new CustomEvent('walletBalanceUpdated', { detail: walletBalance }));
          } catch (err) {}
          updateBalanceDisplay();
          
          // Show success modal
          var successOverlay = document.createElement('div');
          successOverlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:9999';
          
          var successModal = document.createElement('div');
          successModal.style.cssText = 'background:#fff;border-radius:8px;width:360px;padding:24px;box-shadow:0 8px 30px rgba(0,0,0,0.25)';
          
          successModal.innerHTML = '<div style="font-size:18px;font-weight:700;margin-bottom:24px;text-align:center">You\'re All topped-up!</div>' +
                                   '<div style="display:flex;justify-content:space-between;margin-bottom:16px;font-size:14px">' +
                                   '  <span style="color:#999">Top up amount</span>' +
                                   '  <span style="font-weight:600">₱' + amount.toLocaleString(undefined, {minimumFractionDigits: 2}) + '</span>' +
                                   '</div>' +
                                   '<div style="display:flex;justify-content:space-between;margin-bottom:16px;font-size:14px">' +
                                   '  <span style="color:#999">Paid with</span>' +
                                   '  <span style="font-weight:600">' + selectedMethod + '</span>' +
                                   '</div>' +
                                   '<div style="display:flex;justify-content:space-between;margin-bottom:24px;font-size:14px">' +
                                   '  <span style="color:#999">Latest balance</span>' +
                                   '  <span style="font-weight:600">₱' + walletBalance.toLocaleString(undefined, {minimumFractionDigits: 2}) + '</span>' +
                                   '</div>' +
                                   '<button class="btn btn-primary w-100" id="doneBtn" style="width:100%">Done</button>';
          
          successOverlay.appendChild(successModal);
          successModal.addEventListener('click', function(e){ e.stopPropagation(); });
          successOverlay.addEventListener('click', function(){
            if(successOverlay.parentNode) successOverlay.parentNode.removeChild(successOverlay);
          });
          document.body.appendChild(successOverlay);
          
          document.getElementById('doneBtn').addEventListener('click', function(){
            if(successOverlay.parentNode) successOverlay.parentNode.removeChild(successOverlay);
            // Reset form
            amountInput.value = '';
            // Dispatch again shortly after user closes modal so other pages (which may mount after navigation) receive the update
            setTimeout(function(){
              try { window.dispatchEvent(new CustomEvent('walletBalanceUpdated', { detail: localStorage.getItem('walletBalance') })); } catch(e){}
            }, 200);
          });
        });
      });
    }
  })();
</script>

</body>
</html>
